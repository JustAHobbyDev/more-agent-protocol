name: Repair malformed MORE comments

on:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair malformed MORE comment
        uses: JustAHobbyDev/more-agent-protocol/.github/actions/repair-more-comment@main
        with:
          github-token: ${{ github.token }}
